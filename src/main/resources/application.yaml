spring:
  profiles:
    default: dev
  application:
    name: colonia-gaucha-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/colonia_gaucha}
    username: ${POSTGRES_USER:colonia_gaucha}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:true}
      file: compose.yaml
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
    jwt:
      issuer: ${JWT_ISSUER:https://api.coloniagaucha.local}
      audience: ${JWT_AUDIENCE:colonia-gaucha-api}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
      public-key-pem: ${JWT_PUBLIC_KEY:}
      private-key-pem: ${JWT_PRIVATE_KEY:}
      ephemeral-dev-key: ${JWT_EPHEMERAL_DEV_KEY:false}
    refresh:
      token-ttl: ${REFRESH_TOKEN_TTL:P7D}
      cookie-name: refresh_token
      cookie-path: /api/v1/auth
      cookie-secure: ${REFRESH_COOKIE_SECURE:false}
      cookie-same-site: Lax
    bootstrap-admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  level:
    root: INFO
    br.com.coloniagaucha.backend: INFO
